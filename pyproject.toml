[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "answerui-py"
dynamic = ["version"]
description = "Styles and browser behavior for semantic HTML, with FastHTML components"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Jack Hogan", email = "jackhogan4@gmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["python-fasthtml", "fastlucide"]

[project.optional-dependencies]
dev = ["nbdev>=3.3.28", "numpy", "scipy", "matplotlib", "pandas"]

[project.urls]
Repository = "https://github.com/AnswerDotAI/answerui"
Documentation = "https://AnswerDotAI.github.io/answerui/"

[project.entry-points.nbdev]
answerui = "answerui._modidx:d"

[project.entry-points.pyskills]
answerui = "answerui.skill"

[tool.setuptools.dynamic]
version = {attr = "answerui.__version__"}

[tool.setuptools.packages.find]
include = ["answerui", "answerui.*"]

[tool.setuptools.package-data]
answerui = ["assets/*.css", "assets/*.js", "assets/fonts/*"]

[tool.nbdev]
exec_all = true
export_procs = ["answerui._build:build_assets_"]
lib_path = "answerui"

[tool.fastship]
release = "tag"
version-files = ["package.json"]
