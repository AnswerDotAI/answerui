[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "answerui"
dynamic = ["version"]
description = "A semantic HTML UI framework for FastHTML apps"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Jack Hogan", email = "jackhogan4@gmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["python-fasthtml"]

[project.urls]
Repository = "https://github.com/AnswerDotAI/answerui"
Documentation = "https://AnswerDotAI.github.io/answerui/"

[project.entry-points.nbdev]
answerui = "answerui._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "answerui.__version__"}

[tool.setuptools.packages.find]
include = ["answerui"]


[tool.setuptools.package-data]
answerui = ["css/*.css", "css/*.LICENSE"]

[tool.nbdev]
